server {
  listen 80;
  root /usr/share/nginx/html;

  # Imagens (logo/icone) mudam raramente: cache de 7 dias no navegador.
  location /assets/ {
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # O app inteiro e um index.html: sempre revalida, pra ninguem ficar preso numa versao
  # antiga depois de um deploy (versao velha + API nova = alteracao que nao salva).
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
  }
}
